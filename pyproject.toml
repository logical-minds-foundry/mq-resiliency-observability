[project]
name = "mqro"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# Runtime is stdlib-only by design: the collectors deploy verbatim onto MQ nodes
# and must not drag pymqi or any third-party wheel onto a production host.
dependencies = []

[dependency-groups]
dev = ["ruff", "mypy", "ty", "pytest", "pytest-cov", "pip-audit", "pip-licenses", "pytest-xdist"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mqro"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH", "ARG", "PTH", "ERA"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is idiomatic in pytest
# S603/S607: subprocess calls in test helpers are trusted by definition
# ARG: pytest fixtures/monkeypatch stubs legitimately ignore arguments
# E402: fixtures constants may precede imports in a test module
"tests/**" = ["S101", "S603", "S607", "ARG", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pragma: no cover",
    # Protocol / abstract method stub bodies (e.g. `def f() -> int: ...`) are
    # never executed — exclude their inline ellipsis from branch coverage.
    ": \\.\\.\\.$",
]
